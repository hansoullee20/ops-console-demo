# Okja v3 diagnostic: prove the core Korean wake word before widening scope.
#
# v2 mixed 옥자 / 옥자야 / Hey Okja, used only 27 unique positive TTS bases,
# skipped ACAV training negatives, and finished at 13.3% recall / 2.66 FPPH
# (threshold 0.5). v3 deliberately trains only "옥자" and adds a much larger
# ordinary-Korean-speech negative set generated by the external MeloTTS script.
#
# This remains a diagnostic corpus. MeloTTS KR is single-speaker; success here
# is a reason to move to a genuinely multi-speaker corpus, not to ship the ONNX.

model_name: okja_v3_korean_probe

target_phrases:
  - "옥자"

# Generation is external; LiveKit's generate stage is not called.
tts_backend: piper_vits
n_samples: 1024
n_samples_val: 256
n_background_samples: 256
n_background_samples_val: 64
tts_batch_size: 16

custom_negative_phrases:
  - "옥상"
  - "옥수수"
  - "독자"
  - "박자"
  - "학자"
  - "저자"
  - "기자"
  - "숫자"
  - "액자"
  - "왕자"
  - "상자"
  - "환자"
  - "여자"
  - "부자"
  - "모자"
  - "오자"
  - "가자"
  - "앉자"
  - "자자"
  - "옥희"
  - "옥순"
  - "옥경"
  - "옥분"
  - "옥진"
  - "혹자"
  - "목자"
  - "족자"
  - "적자"
  - "흑자"
  - "타자"
  - "투자"
  - "전자"

data_dir: ./wakeword_v3_data
output_dir: ./wakeword_v3_output

augmentation:
  clip_duration: 2.0
  batch_size: 16
  rounds: 2
  background_paths: [./wakeword_v3_data/backgrounds]
  rir_paths: [./wakeword_v3_data/rirs]

model:
  model_type: conv_attention
  model_size: small

# Still intentionally runner-sized: this is a falsifiable diagnostic, not the
# final production-scale run. Upstream's production guidance is far larger.
steps: 12000
learning_rate: 0.0001
weight_decay: 0.01
label_smoothing: 0.03
max_negative_weight: 2000
target_fp_per_hour: 0.5

# ACAV remains disabled in this *diagnostic* because the corpus is ~16 GB.
# Unlike v2, however, 4096 externally generated negatives are split 50/50
# between close confusers and ordinary Korean home/TV-like speech. The official
# LiveKit validation-negative feature set remains untouched for FPPH evaluation.
batch_n_per_class:
  positive: 16
  adversarial_negative: 64
  ACAV100M_sample: 0
  background_noise: 16

output_format: onnx
