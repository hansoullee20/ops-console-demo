plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.soul.aihub'
    compileSdk 36

    defaultConfig {
        applicationId "com.soul.aihub"
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName "0.2-test"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // ASR model blobs are already binary/quantized and can be hundreds of MB. Avoid
    // AGP reading them wholesale into heap for asset compression; keeping them
    // uncompressed also gives native runtimes efficient AssetManager access.
    // The physical-command model is memory-mapped by LiteRT and must also stay uncompressed.
    androidResources {
        noCompress += ['onnx', 'ort', 'tflite', 'ppn', 'pv']
    }
}

dependencies {
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation 'com.github.k2-fsa:sherpa-onnx:v1.13.4'

    // Low-level wake API only. Okja never uses PorcupineManager because AudioEngine owns the mic.
    implementation 'ai.picovoice:porcupine-android:4.0.2'

    // Use the system-provided LiteRT runtime from Google Play services for the tiny physical
    // command classifier. Do not add onnxruntime-android here: sherpa-onnx v1.13.4 already
    // packages a version-pinned libonnxruntime.so, and a second ORT JNI/runtime can conflict.
    implementation 'com.google.android.gms:play-services-tflite-java:16.5.0'

    testImplementation 'junit:junit:4.13.2'
}
