# The benchmark APK packages multiple large local ASR model assets. AGP's asset
# packaging workers may materialize a single model in heap even when the extension is
# marked noCompress, so keep enough headroom on GitHub-hosted runners.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

# Porcupine 4.0.2 and Google Play services LiteRT both depend on AndroidX.
android.useAndroidX=true
