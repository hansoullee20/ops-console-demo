name: Build patched Okja lifecycle APK once

on:
  push:
    branches: [ aihub-voice-test ]
    paths:
      - '.github/workflows/okja-lifecycle-build-once.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aihub-voice-test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle -p aihub assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: okja-lifecycle-fixed-apk
          path: aihub/app/build/outputs/apk/debug/app-debug.apk
