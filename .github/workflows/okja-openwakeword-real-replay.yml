name: Okja openWakeWord Real Replay

on:
  workflow_dispatch:
  push:
    branches: [aihub-voice-test]
    paths:
      - 'aihub/wakeword/v4_replay.py'
      - 'aihub/wakeword/livekit_v3_replay_adapter.py'
      - 'aihub/wakeword/openwakeword_replay_adapter.py'
      - '.github/workflows/okja-openwakeword-real-replay.yml'

permissions:
  actions: read
  contents: read

jobs:
  replay-openwakeword:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download pinned v3 ONNX artifact
        uses: actions/download-artifact@v4
        with:
          name: okja-wakeword-v3-korean-probe
          path: replay-inputs/v3
          github-token: ${{ github.token }}
          repository: hansoullee20/ops-console-demo
          run-id: '31583273747'

      - name: Download pinned human-approved MeloTTS WAV artifact
        uses: actions/download-artifact@v4
        with:
          name: okja-v4-smoke-melotts
          path: replay-inputs/audio
          github-token: ${{ github.token }}
          repository: hansoullee20/ops-console-demo
          run-id: '31615755020'

      - name: Verify pinned input hashes
        run: |
          echo '3cff1a6c54e2eece99f3b61e0238a51b317019d5c1bf214e2c1bddf80998bb7b  replay-inputs/v3/wakeword_v3_output/okja_v3_korean_probe/okja_v3_korean_probe.onnx' | sha256sum -c -
          echo 'a9551898057bfc145002e7e4c0abffff759f450a67e706465d70a18953c5f2a0  replay-inputs/audio/audio/smoke_melotts_01.wav' | sha256sum -c -

      - name: Install pinned openWakeWord runtime
        run: python -m pip install 'openwakeword==0.6.0'

      - name: Download versioned openWakeWord feature models
        run: |
          mkdir -p replay-inputs/openwakeword
          curl --fail --location --retry 5 \
            --output replay-inputs/openwakeword/melspectrogram.onnx \
            https://github.com/dscripka/openWakeWord/releases/download/v0.5.1/melspectrogram.onnx
          curl --fail --location --retry 5 \
            --output replay-inputs/openwakeword/embedding_model.onnx \
            https://github.com/dscripka/openWakeWord/releases/download/v0.5.1/embedding_model.onnx
          echo '70d164290c1d095d1d4ee149bc5e00543250a7316b59f31d056cff7bd3075c1f  replay-inputs/openwakeword/embedding_model.onnx' | sha256sum -c -
          echo 'ba2b0e0f8b7b875369a2c89cb13360ff53bac436f2895cced9f479fa65eb176f  replay-inputs/openwakeword/melspectrogram.onnx' | sha256sum -c -

      - name: Replay identical WAV at v3 evaluation thresholds
        env:
          MODEL: replay-inputs/v3/wakeword_v3_output/okja_v3_korean_probe/okja_v3_korean_probe.onnx
          AUDIO: replay-inputs/audio/audio/smoke_melotts_01.wav
          MODEL_SOURCE: github-actions:run-31583273747/artifact-9136765226
          AUDIO_SOURCE: github-actions:run-31615755020/artifact-9149302273
          ADAPTER_SOURCE: ${{ github.repository }}@${{ github.sha }}:aihub/wakeword/openwakeword_replay_adapter.py
        run: |
          adapter='python aihub/wakeword/openwakeword_replay_adapter.py --audio {audio} --model {model} --melspec-model replay-inputs/openwakeword/melspectrogram.onnx --embedding-model replay-inputs/openwakeword/embedding_model.onnx --initialization-seed 0 --threshold {threshold} --expected-engine-version {engine_version} --frame-samples 1280 --debounce-ms 2000'
          for threshold in 0.5 0.06; do
            out="replay-evidence/threshold-${threshold}"
            python aihub/wakeword/v4_replay.py \
              --audio "$AUDIO" \
              --model "$MODEL" \
              --engine-id openwakeword-v3-compat \
              --engine-version 0.6.0 \
              --threshold "$threshold" \
              --adapter-command "$adapter" \
              --repeats 3 \
              --audio-source "$AUDIO_SOURCE" \
              --model-source "$MODEL_SOURCE" \
              --adapter-source "$ADAPTER_SOURCE" \
              --detections-out "$out/detections.jsonl" \
              --manifest-out "$out/manifest.json"
          done

      - name: Upload deterministic replay evidence
        uses: actions/upload-artifact@v4
        with:
          name: okja-openwakeword-real-replay-${{ github.run_id }}
          path: replay-evidence/**
          if-no-files-found: error
          retention-days: 30
