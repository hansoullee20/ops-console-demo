name: Close Okja G2 recording contract once

on:
  workflow_dispatch:
  push:
    branches: [aihub-voice-test]
    paths:
      - '.github/workflows/okja-close-g2-recording-contract-once.yml'

permissions:
  contents: write

jobs:
  verify-close:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Tighten session timestamp validation and tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          contract = Path('aihub/wakeword/v4_benchmark_contract.py')
          s = contract.read_text(encoding='utf-8')

          old = '''def validate_session(row: dict[str, Any]) -> None:\n'''
          new = '''def _validate_datetime(value: str, kind: str, field: str) -> None:\n    normalized = value[:-1] + "+00:00" if value.endswith("Z") else value\n    try:\n        parsed = datetime.fromisoformat(normalized)\n    except ValueError as exc:\n        raise ValueError(f"{kind}: {field} must be an ISO-8601 date-time") from exc\n    if parsed.tzinfo is None or parsed.utcoffset() is None:\n        raise ValueError(f"{kind}: {field} must include a timezone offset")\n\n\ndef validate_session(row: dict[str, Any]) -> None:\n'''
          if s.count(old) != 1:
              raise SystemExit(f'validate_session anchor count={s.count(old)}')
          s = s.replace(old, new, 1)

          old = '''    if row["schema_version"] != SCHEMA_VERSION:\n        raise ValueError(f"{kind}: schema_version must be {SCHEMA_VERSION}")\n    if row["test_set"] not in TEST_SETS:\n'''
          new = '''    if row["schema_version"] != SCHEMA_VERSION:\n        raise ValueError(f"{kind}: schema_version must be {SCHEMA_VERSION}")\n    _validate_datetime(row["started_at"], kind, "started_at")\n    if row["test_set"] not in TEST_SETS:\n'''
          if s.count(old) != 1:
              raise SystemExit(f'session validation anchor count={s.count(old)}')
          s = s.replace(old, new, 1)
          contract.write_text(s, encoding='utf-8')

          tests = Path('aihub/wakeword/test_v4_benchmark_contract.py')
          t = tests.read_text(encoding='utf-8')
          old = '''        bad_name = dict(row, audio_filename="capture.wav")\n        with self.assertRaisesRegex(ValueError, "must include device_id"):\n            validate_session(bad_name)\n\n'''
          new = '''        bad_name = dict(row, audio_filename="capture.wav")\n        with self.assertRaisesRegex(ValueError, "must include device_id"):\n            validate_session(bad_name)\n        bad_timestamp = dict(row, started_at="2026-08-13T08:00:00")\n        with self.assertRaisesRegex(ValueError, "timezone offset"):\n            validate_session(bad_timestamp)\n        malformed_timestamp = dict(row, started_at="not-a-time")\n        with self.assertRaisesRegex(ValueError, "ISO-8601"):\n            validate_session(malformed_timestamp)\n\n'''
          if t.count(old) != 1:
              raise SystemExit(f'test anchor count={t.count(old)}')
          t = t.replace(old, new, 1)
          tests.write_text(t, encoding='utf-8')
          PY
          git diff --check

      - name: Run benchmark contract tests
        working-directory: aihub/wakeword
        run: python -m unittest -v test_v4_benchmark_contract.py

      - name: Commit verified contract hardening
        id: code_commit
        shell: bash
        run: |
          git config user.name 'Okja CI'
          git config user.email 'okja-ci@users.noreply.github.com'
          git add aihub/wakeword/v4_benchmark_contract.py aihub/wakeword/test_v4_benchmark_contract.py
          git commit -m 'Validate benchmark session timestamps strictly'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Close G2.1 and G2.2 with evidence
        env:
          CODE_SHA: ${{ steps.code_commit.outputs.sha }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          code_sha = os.environ['CODE_SHA']
          run_id = os.environ['GITHUB_RUN_ID']
          path = Path('AIHUB_MASTER_EXECUTION_CHECKLIST.md')
          s = path.read_text(encoding='utf-8')

          old1 = '- [ ] **G2.1 24-hour household recording spec implemented** — P0 / AI-ENG  \n  DoD: file naming, device/room metadata, timestamps, firmware/model SHA and consent/retention fields are defined and validated.\n'
          new1 = (
              '- [x] **G2.1 24-hour household recording spec implemented** — P0 / AI-ENG\n'
              '  DoD: file naming, device/room metadata, timestamps, firmware/model SHA and consent/retention fields are defined and validated.\n'
              f'  Evidence: `v4_benchmark_schema.json` + `v4_benchmark_contract.py` require and validate recording/device/room IDs, timezone-aware start time, duration, WAV basename, audio SHA-256, firmware/app/model provenance, consent, retention and TEST_D immutability/training exclusion; tests pass after commit `{code_sha}` in verification run `{run_id}`.\n'
          )
          old2 = '- [ ] **G2.2 Intentional-wake marker exists** — P0 / AI-ENG  \n  DoD: intentional wake attempts can be timestamped with speaker, phrase, distance, voice level and environment.\n'
          new2 = (
              '- [x] **G2.2 Intentional-wake marker exists** — P0 / AI-ENG\n'
              '  DoD: intentional wake attempts can be timestamped with speaker, phrase, distance, voice level and environment.\n'
              f'  Evidence: `v4_benchmark_contract.py mark-wake` writes evaluator-compatible truth JSONL with recording-relative timestamp, speaker, phrase/language, distance, direction, voice level, room/background/condition and mention-context; unit test `test_marker_writes_evaluator_compatible_truth_row` passes in run `{run_id}`.\n'
          )
          for old, new in ((old1, new1), (old2, new2)):
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'checklist anchor count={count}: {old.splitlines()[0]}')
              s = s.replace(old, new, 1)
          path.write_text(s, encoding='utf-8')
          PY
          git diff --check

      - name: Commit checklist evidence and push
        shell: bash
        run: |
          git add AIHUB_MASTER_EXECUTION_CHECKLIST.md
          git commit -m 'Record G2 recording contract evidence'
          git pull --rebase origin aihub-voice-test
          git push origin HEAD:aihub-voice-test
