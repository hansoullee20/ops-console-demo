name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix closed overlay opacity
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '.scrim{position:absolute;inset:0;background:rgba(16,24,40,.2)}',
              '.scrim{position:absolute;inset:0;background:rgba(16,24,40,.2);opacity:0}.drawerwrap.open .scrim{opacity:1}'
          )
          s = s.replace(
              '.ai-scrim{position:absolute;inset:0;background:rgba(17,24,39,.12)}',
              '.ai-scrim{position:absolute;inset:0;background:rgba(17,24,39,.12);opacity:0}.ai-panel-wrap.open .ai-scrim{opacity:1}'
          )
          p.write_text(s, encoding='utf-8')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
