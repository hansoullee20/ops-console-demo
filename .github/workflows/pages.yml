name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject demo enhancements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          v=os.environ.get('GITHUB_SHA','dev')[:12]
          s=s.replace('</head>', f'<link rel="stylesheet" href="./profile.css?v={v}">\n</head>', 1)
          s=s.replace('</body>', f'<script src="./profile.js?v={v}"></script>\n</body>', 1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
