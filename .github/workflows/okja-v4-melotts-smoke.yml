name: Okja v4 MeloTTS Candidate Smoke

on:
  workflow_dispatch:
  push:
    branches: [aihub-voice-test]
    paths:
      - 'aihub/wakeword/v4_melotts_smoke.py'
      - '.github/workflows/okja-v4-melotts-smoke.yml'

permissions:
  contents: read

jobs:
  melotts-korean-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libsndfile1

      - name: Install pinned base runtime
        run: |
          # MeloTTS imports librosa 0.9.1, which imports pkg_resources.
          # setuptools >=82 removed pkg_resources, so keep the last compatible line pinned.
          python -m pip install 'pip==26.0.1' 'setuptools==80.10.2' 'wheel==0.48.0'
          pip install \
            'numpy==1.26.4' \
            'scipy==1.13.1' \
            'soundfile==0.12.1' \
            'torch==2.2.2' \
            'torchaudio==2.2.2' \
            'python-mecab-ko==1.3.7' \
            'python-mecab-ko-dic==2.1.1.post2'

      - name: Install pinned MeloTTS implementation
        run: |
          pip install 'git+https://github.com/myshell-ai/MeloTTS.git@209145371cff8fc3bd60d7be902ea69cbdb7965a'
          # Re-assert setuptools because build isolation/dependency resolution must not silently
          # move this environment onto setuptools >=82 where pkg_resources is absent.
          pip install --force-reinstall 'setuptools==80.10.2'
          python - <<'PY'
          import pkg_resources
          print('pkg_resources import: ok')
          PY
          python -m unidic download
          python - <<'PY'
          from importlib.metadata import version
          for p in ('melotts','setuptools','torch','torchaudio','numpy','scipy','soundfile','python-mecab-ko'):
              try:
                  print(p, version(p))
              except Exception as exc:
                  print(p, 'VERSION_ERROR', type(exc).__name__, exc)
          PY

      - name: Generate tiny Korean candidate corpus
        run: |
          python aihub/wakeword/v4_melotts_smoke.py

      - name: Assign deterministic engine holdout split
        run: |
          python aihub/wakeword/v4_dataset_tools.py assign-splits \
            --input out/v4-smoke-melotts/manifest_raw.csv \
            --output out/v4-smoke-melotts/manifest_split.csv

      - name: Run WAV QC
        run: |
          python aihub/wakeword/v4_dataset_tools.py audio-qc \
            --input out/v4-smoke-melotts/manifest_split.csv \
            --audio-root out/v4-smoke-melotts \
            --output out/v4-smoke-melotts/manifest_qc.csv \
            --fail-on-qc

      - name: Check leakage and holdout semantics
        run: |
          python aihub/wakeword/v4_dataset_tools.py check-leakage \
            --input out/v4-smoke-melotts/manifest_qc.csv

      - name: Capture environment
        if: always()
        run: |
          mkdir -p out/v4-smoke-melotts
          pip freeze > out/v4-smoke-melotts/environment.txt

      - name: Write candidate summary
        if: always()
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root = Path('out/v4-smoke-melotts')
          p = root / 'manifest_qc.csv'
          rows = list(csv.DictReader(p.open(encoding='utf-8'))) if p.exists() else []
          summary = {
              'engine': 'melotts',
              'status': 'candidate_pending_human_pronunciation_and_naturalness_qc',
              'clips': len(rows),
              'qc_pass': sum(r.get('qc_status') == 'pass' for r in rows),
              'splits': {},
              'labels': {},
              'pronunciation_review_required': True,
              'naturalness_review_required': True,
          }
          for r in rows:
              summary['splits'][r.get('split','')] = summary['splits'].get(r.get('split',''), 0) + 1
              summary['labels'][r.get('label','')] = summary['labels'].get(r.get('label',''), 0) + 1
          root.mkdir(parents=True, exist_ok=True)
          (root / 'summary.json').write_text(json.dumps(summary, indent=2, ensure_ascii=False), encoding='utf-8')
          print(json.dumps(summary, indent=2, ensure_ascii=False))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: okja-v4-smoke-melotts
          path: out/v4-smoke-melotts
          if-no-files-found: ignore
          retention-days: 7
