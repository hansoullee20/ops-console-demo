name: Okja v4 Data Smoke

on:
  workflow_dispatch:
  push:
    branches: [aihub-voice-test]
    paths:
      - 'aihub/wakeword/v4_tts_smoke.py'
      - 'aihub/wakeword/v4_dataset_tools.py'
      - 'aihub/wakeword/v4_dataset_schema.json'
      - 'aihub/wakeword/requirements-v4-kokoro-py311-linux.lock'
      - 'aihub/wakeword/requirements-v4-chatterbox-py311-linux.lock'
      - '.github/workflows/okja-v4-data-smoke.yml'

jobs:
  kokoro-english-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng

      - name: Install Python dependencies
        run: |
          python -m pip install 'pip==26.2.1'
          python -m pip install -r aihub/wakeword/requirements-v4-kokoro-py311-linux.lock
          python -m pip check
          grep -v '^#' aihub/wakeword/requirements-v4-kokoro-py311-linux.lock > /tmp/expected-runtime.lock
          python -m pip freeze | LC_ALL=C sort > /tmp/actual-runtime.lock
          diff -u /tmp/expected-runtime.lock /tmp/actual-runtime.lock

      - name: Generate tiny real TTS corpus
        run: |
          python aihub/wakeword/v4_tts_smoke.py \
            --engine kokoro \
            --output-dir out/v4-smoke-kokoro

      - name: Assign deterministic splits
        run: |
          python aihub/wakeword/v4_dataset_tools.py assign-splits \
            --input out/v4-smoke-kokoro/manifest_raw.csv \
            --output out/v4-smoke-kokoro/manifest_split.csv

      - name: Run WAV QC
        run: |
          python aihub/wakeword/v4_dataset_tools.py audio-qc \
            --input out/v4-smoke-kokoro/manifest_split.csv \
            --audio-root out/v4-smoke-kokoro \
            --output out/v4-smoke-kokoro/manifest_qc.csv \
            --fail-on-qc

      - name: Validate manifest contract
        run: |
          python aihub/wakeword/v4_dataset_tools.py validate-manifest \
            --input out/v4-smoke-kokoro/manifest_qc.csv

      - name: Check leakage
        run: |
          python aihub/wakeword/v4_dataset_tools.py check-leakage \
            --input out/v4-smoke-kokoro/manifest_qc.csv

      - name: Capture resolved environment
        if: always()
        run: |
          mkdir -p out/v4-smoke-kokoro
          python --version > out/v4-smoke-kokoro/python-version.txt
          python -m pip --version > out/v4-smoke-kokoro/pip-version.txt
          python -m pip freeze | LC_ALL=C sort > out/v4-smoke-kokoro/environment.txt

      - name: Write smoke summary
        if: always()
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root = Path('out/v4-smoke-kokoro')
          p = root / 'manifest_qc.csv'
          rows = list(csv.DictReader(p.open(encoding='utf-8'))) if p.exists() else []
          summary = {
              'engine': 'kokoro',
              'clips': len(rows),
              'qc_pass': sum(r.get('qc_status') == 'pass' for r in rows),
              'labels': {},
              'languages': {},
              'pronunciation_review_required': True,
          }
          for r in rows:
              summary['labels'][r['label']] = summary['labels'].get(r['label'], 0) + 1
              summary['languages'][r['language']] = summary['languages'].get(r['language'], 0) + 1
          root.mkdir(parents=True, exist_ok=True)
          (root / 'summary.json').write_text(json.dumps(summary, indent=2), encoding='utf-8')
          print(json.dumps(summary, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: okja-v4-smoke-kokoro
          path: out/v4-smoke-kokoro
          if-no-files-found: ignore
          retention-days: 7

  chatterbox-korean-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'

      - name: Install Python dependencies
        run: |
          python -m pip install 'pip==26.2.1'
          python -m pip install -r aihub/wakeword/requirements-v4-chatterbox-py311-linux.lock
          python -m pip check
          grep -v '^#' aihub/wakeword/requirements-v4-chatterbox-py311-linux.lock > /tmp/expected-runtime.lock
          python -m pip freeze | LC_ALL=C sort > /tmp/actual-runtime.lock
