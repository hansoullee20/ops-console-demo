name: Build AI Hub test APK

on:
  workflow_dispatch:
  push:
    branches: [ aihub-voice-test ]
    paths:
      - 'aihub/**'
      - '.github/workflows/aihub-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle -p aihub assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: aihub-dual-profile-debug-apk
          path: aihub/app/build/outputs/apk/debug/app-debug.apk
