name: Build AI Hub test APK

on:
  workflow_dispatch:
  push:
    branches: [ aihub-voice-test ]
    paths:
      - 'aihub/**'
      - '.github/workflows/aihub-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Probe Korean Vosk wake vocabulary
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            https://alphacephei.com/vosk/models/vosk-model-small-ko-0.22.zip \
            -o /tmp/vosk-ko.zip
          rm -rf /tmp/vosk-ko
          mkdir -p /tmp/vosk-ko
          unzip -q /tmp/vosk-ko.zip -d /tmp/vosk-ko
          WORDS=$(find /tmp/vosk-ko -type f -name words.txt | head -n 1)
          echo "words file: $WORDS"
          if [ -z "$WORDS" ]; then
            echo "No words.txt found"
            exit 2
          fi
          echo "=== exact wake-word vocabulary hits ==="
          grep -nE '^(옥자|옥자야|헤이|오케이) ' "$WORDS" || true
          echo "=== words containing 옥자 ==="
          grep -n '옥자' "$WORDS" | head -n 20 || true

      - name: Build debug APK
        run: gradle -p aihub assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: aihub-dual-profile-debug-apk
          path: aihub/app/build/outputs/apk/debug/app-debug.apk
