name: Build AI Hub test APK

on:
  workflow_dispatch:
  push:
    branches: [ aihub-voice-test ]
    paths:
      - 'aihub/**'
      - '.github/workflows/aihub-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Probe Korean Vosk wake vocabulary
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            https://alphacephei.com/vosk/models/vosk-model-small-ko-0.22.zip \
            -o /tmp/vosk-ko.zip
          rm -rf /tmp/vosk-ko
          mkdir -p /tmp/vosk-ko
          unzip -q /tmp/vosk-ko.zip -d /tmp/vosk-ko
          python -m pip install --quiet vosk
          MODEL_DIR=$(find /tmp/vosk-ko -mindepth 1 -maxdepth 1 -type d | head -n 1)
          export MODEL_DIR
          python - <<'PY'
          import os
          from vosk import Model, SetLogLevel
          SetLogLevel(-1)
          model = Model(os.environ['MODEL_DIR'])
          words = ['옥자', '옥자야', '헤이', '오케이', '에이아이', '허브']
          print('=== Vosk Korean vocabulary probe ===')
          for word in words:
              wid = model.vosk_model_find_word(word)
              print(f'{word}: {wid} ({"YES" if wid >= 0 else "NO"})')
          if model.vosk_model_find_word('옥자') < 0:
              raise SystemExit('옥자 is not in the Korean model vocabulary')
          PY

      - name: Build debug APK
        run: gradle -p aihub assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: aihub-dual-profile-debug-apk
          path: aihub/app/build/outputs/apk/debug/app-debug.apk
