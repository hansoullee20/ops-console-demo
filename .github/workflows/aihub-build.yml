name: Verify and build AI Hub test APK

on:
  workflow_dispatch:
  push:
    branches: [ aihub-voice-test, feat/voice-pipeline-v2 ]
    paths:
      - 'aihub/**'
      - '.github/workflows/aihub-build.yml'
  pull_request:
    branches: [ aihub-voice-test ]
    paths:
      - 'aihub/**'
      - '.github/workflows/aihub-build.yml'

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile bridge modules
        run: |
          python -m py_compile \
            aihub/phone/aihub_bridge_codex.py \
            aihub/phone/okja_event_contract.py \
            aihub/phone/okja_intent_confirmation.py

      - name: Run deterministic pre-build failure matrix
        working-directory: aihub/phone
        run: python -m unittest -v test_prebuild_failure_matrix.py

      - name: Compile protected-command tooling
        working-directory: aihub/command_classifier
        run: |
          python -m py_compile \
            corpus.py \
            validate_corpus.py \
            install_qualified_classifier.py \
            train_physical_classifier.py \
            test_install_qualified_classifier.py

      - name: Verify qualified-model deployment gate
        working-directory: aihub/command_classifier
        run: python -m unittest -v test_install_qualified_classifier.py

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run Android JVM tests
        run: gradle -p aihub testDebugUnitTest --stacktrace

      - name: Provision Moonshine tiny-ko assets for sanity re-record APK
        run: bash aihub/tools/fetch_sherpa_moonshine_korean_model.sh

      - name: Build debug APK after verification
        run: gradle -p aihub assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: aihub-dual-profile-debug-apk
          path: aihub/app/build/outputs/apk/debug/app-debug.apk
