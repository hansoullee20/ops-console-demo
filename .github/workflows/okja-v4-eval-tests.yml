name: Okja v4 Evaluator Tests

on:
  workflow_dispatch:
  push:
    branches: [aihub-voice-test]
    paths:
      - 'aihub/wakeword/v4_eval.py'
      - 'aihub/wakeword/test_v4_eval.py'
      - 'aihub/wakeword/v4_benchmark_contract.py'
      - 'aihub/wakeword/v4_benchmark_schema.json'
      - 'aihub/wakeword/test_v4_benchmark_contract.py'
      - 'aihub/wakeword/v4_ring_buffer_logger.py'
      - 'aihub/wakeword/test_v4_ring_buffer_logger.py'
      - 'aihub/wakeword/v4_replay.py'
      - 'aihub/wakeword/test_v4_replay.py'
      - 'aihub/wakeword/livekit_v3_replay_adapter.py'
      - 'aihub/wakeword/test_livekit_v3_replay_adapter.py'
      - 'aihub/wakeword/openwakeword_replay_adapter.py'
      - 'aihub/wakeword/test_openwakeword_replay_adapter.py'
      - 'aihub/wakeword/v4_dataset_tools.py'
      - 'aihub/wakeword/v4_dataset_schema.json'
      - 'aihub/wakeword/test_v4_dataset_tools.py'
      - '.github/workflows/okja-v4-eval-tests.yml'

permissions:
  contents: read

jobs:
  evaluator-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run evaluator, dataset, benchmark-contract, ring-buffer, and replay unit tests
        working-directory: aihub/wakeword
        run: python -m unittest -v test_v4_eval.py test_v4_dataset_tools.py test_v4_benchmark_contract.py test_v4_ring_buffer_logger.py test_v4_replay.py test_livekit_v3_replay_adapter.py test_openwakeword_replay_adapter.py
