name: Build Okja local ASR benchmark APK

on:
  workflow_dispatch:
  push:
    branches: [ feat/voice-pipeline-v2 ]
    paths:
      - '.github/workflows/okja-local-asr-benchmark-apk.yml'
  pull_request:
    branches: [ aihub-voice-test ]
    paths:
      - '.github/workflows/okja-local-asr-benchmark-apk.yml'

jobs:
  build-benchmark-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify Android JVM tests before model provisioning
        run: gradle -p aihub testDebugUnitTest --stacktrace

      - name: Provision official Korean ASR model assets
        run: |
          bash aihub/tools/fetch_sherpa_moonshine_korean_model.sh
          bash aihub/tools/fetch_sherpa_korean_model.sh

      - name: Build benchmark APK with both Korean models
        run: gradle -p aihub assembleDebug --stacktrace

      - name: Record APK and model provenance
        run: |
          mkdir -p benchmark-provenance
          sha256sum aihub/app/build/outputs/apk/debug/app-debug.apk \
            | tee benchmark-provenance/APK_SHA256.txt
          cp aihub/app/src/main/assets/sherpa-onnx-moonshine-tiny-ko-quantized-2026-02-27/OKJA_MODEL_PROVENANCE.txt \
            benchmark-provenance/moonshine-archive.txt
          cp aihub/app/src/main/assets/sherpa-onnx-moonshine-tiny-ko-quantized-2026-02-27/OKJA_MODEL_FILES.sha256 \
            benchmark-provenance/moonshine-files.sha256
          cp aihub/app/src/main/assets/sherpa-onnx-streaming-zipformer-korean-2024-06-16/OKJA_MODEL_PROVENANCE.txt \
            benchmark-provenance/zipformer-archive.txt
          cp aihub/app/src/main/assets/sherpa-onnx-streaming-zipformer-korean-2024-06-16/OKJA_MODEL_FILES.sha256 \
            benchmark-provenance/zipformer-files.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: okja-local-asr-benchmark-apk
          retention-days: 7
          path: |
            aihub/app/build/outputs/apk/debug/app-debug.apk
            benchmark-provenance/*
