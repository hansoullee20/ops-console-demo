name: Close Okja G2 metrics once

on:
  workflow_dispatch:
  push:
    branches: [aihub-voice-test]
    paths:
      - '.github/workflows/okja-close-g2-metrics-once.yml'

permissions:
  contents: write

jobs:
  verify-close:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply G2 metric implementation patch
        env:
          PATCH_MODE: code
        run: python aihub/wakeword/_patch_g2_metrics_once.py

      - name: Verify patch shape
        run: |
          git diff --check
          grep -q 'by_distance' aihub/wakeword/v4_eval.py
          grep -q 'by_self_tts' aihub/wakeword/v4_eval.py
          grep -q 'by_time_bucket' aihub/wakeword/v4_eval.py
          grep -q -- '--self-tts' aihub/wakeword/v4_benchmark_contract.py
          grep -q -- '--time-bucket' aihub/wakeword/v4_benchmark_contract.py

      - name: Run evaluator, contract, and ring-buffer tests
        working-directory: aihub/wakeword
        run: python -m unittest -v test_v4_eval.py test_v4_benchmark_contract.py test_v4_ring_buffer_logger.py

      - name: Exercise evaluator CLI threshold report
        working-directory: aihub/wakeword
        shell: bash
        run: |
          cat > /tmp/truth.jsonl <<'EOF'
          {"event_id":"a","timestamp_ms":1000,"phrase":"옥자","speaker_id":"grandma","condition":"quiet","room_id":"living","background":"tv_noise","distance_m":1.0,"direction":"front","voice_level":"normal","self_tts":false,"time_bucket":"day"}
          EOF
          cat > /tmp/detections.jsonl <<'EOF'
          {"timestamp_ms":1100,"score":0.9,"model":"fixture","version":"1"}
          {"timestamp_ms":9000,"score":0.7,"model":"fixture","version":"1"}
          EOF
          python v4_eval.py --truth /tmp/truth.jsonl --detections /tmp/detections.jsonl --negative-exposure-hours 24 --thresholds 0.5,0.8 --output /tmp/report.json > /tmp/report.stdout.json
          python - <<'PY'
          import json
          with open('/tmp/report.json', encoding='utf-8') as f:
              r=json.load(f)
          assert len(r['threshold_sweep']) == 2
          row=r['threshold_sweep'][0]
          assert 'fpph' in row and 'recall' in row and 'miss_rate' in row
          assert row['fp_rate_ci95']['upper_per_hour'] is not None
          assert 'by_distance' in row and 'by_self_tts' in row and 'by_time_bucket' in row
          print(json.dumps({'thresholds':[x['threshold'] for x in r['threshold_sweep']], 'groups':'ok', 'confidence':'ok'}))
          PY

      - name: Commit verified metric implementation
        id: code_commit
        shell: bash
        run: |
          git config user.name 'Okja CI'
          git config user.email 'okja-ci@users.noreply.github.com'
          git add aihub/wakeword/v4_eval.py aihub/wakeword/test_v4_eval.py aihub/wakeword/v4_benchmark_schema.json aihub/wakeword/v4_benchmark_contract.py aihub/wakeword/test_v4_benchmark_contract.py
          git commit -m 'Expand wake benchmark metric breakdowns'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Close satisfied G2 metric checklist items
        env:
          PATCH_MODE: checklist
          CODE_SHA: ${{ steps.code_commit.outputs.sha }}
        run: python aihub/wakeword/_patch_g2_metrics_once.py

      - name: Commit checklist evidence and push
        shell: bash
        run: |
          git diff --check
          git add AIHUB_MASTER_EXECUTION_CHECKLIST.md
          git commit -m 'Record G2 wake metric evidence'
          git pull --rebase origin aihub-voice-test
          git push origin HEAD:aihub-voice-test
